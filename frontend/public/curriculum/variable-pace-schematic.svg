<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" role="img" aria-labelledby="title desc">
  <title id="title">Valid pace vs invalid sum</title>
  <desc id="desc">Pitches N and innings i combine to pace N divided by i, not N plus i.</desc>
  <rect x="4" y="4" width="412" height="112" fill="#f8fafc" stroke="#cbd5e1" rx="8"/>
  <text x="24" y="36" font-family="system-ui,sans-serif" font-size="15" fill="#0f172a">Quantities</text>
  <rect x="24" y="48" width="100" height="44" fill="#e0f2fe" stroke="#0284c7" rx="4"/>
  <text x="44" y="76" font-family="system-ui,sans-serif" font-size="13" fill="#0c4a6e">N pitches</text>
  <rect x="140" y="48" width="100" height="44" fill="#e0f2fe" stroke="#0284c7" rx="4"/>
  <text x="168" y="76" font-family="system-ui,sans-serif" font-size="13" fill="#0c4a6e">i innings</text>
  <path d="M 260 70 L 300 70" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="308" y="58" font-family="system-ui,sans-serif" font-size="13" fill="#14532d">pace = N / i</text>
  <text x="308" y="82" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">(pitches per inning)</text>
  <path d="M 260 100 L 300 100" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="308" y="104" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">N + i → not meaningful</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
